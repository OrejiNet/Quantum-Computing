<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="740" height="330" fill="#ffffff"/>
  <defs>
    <g id="h"><rect x="-5.5" y="-5.5" width="11" height="11" fill="#ffe34d" stroke="#6b5a00" stroke-width="1.2"/></g>
  </defs>

  <text x="30" y="36" font-size="20" fill="#3b3b8f">Hadamard y cambios de color</text>

  <!-- Fila 1: notación -->
  <g stroke="#333" stroke-width="1.6">
    <line x1="260" y1="95" x2="345" y2="95"/>
    <line x1="420" y1="95" x2="490" y2="95"/>
  </g>
  <rect x="290" y="82" width="26" height="26" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="303" y="101" font-size="16" text-anchor="middle">H</text>
  <text x="382" y="101" font-size="20" text-anchor="middle">⇝</text>
  <use href="#h" x="455" y="95"/>

  <!-- Fila 2 -->
  <g stroke="#333" stroke-width="1.6" fill="none">
    <!-- A -->
    <line x1="140" y1="210" x2="80" y2="180"/><line x1="140" y1="210" x2="80" y2="240"/>
    <line x1="140" y1="210" x2="200" y2="180"/><line x1="140" y1="210" x2="200" y2="240"/>
    <!-- B -->
    <line x1="370" y1="210" x2="310" y2="180"/><line x1="370" y1="210" x2="310" y2="240"/>
    <line x1="370" y1="210" x2="430" y2="180"/><line x1="370" y1="210" x2="430" y2="240"/>
    <!-- C -->
    <line x1="600" y1="210" x2="540" y2="180"/><line x1="600" y1="210" x2="540" y2="240"/>
    <line x1="600" y1="210" x2="660" y2="180"/><line x1="600" y1="210" x2="660" y2="240"/>
  </g>

  <!-- Hadamards -->
  <use href="#h" x="107" y="193.5"/><use href="#h" x="107" y="226.5"/>
  <use href="#h" x="337" y="193.5"/><use href="#h" x="337" y="226.5"/>
  <use href="#h" x="394" y="198"/><use href="#h" x="394" y="222"/>
  <use href="#h" x="415" y="187.5"/><use href="#h" x="415" y="232.5"/>
  <use href="#h" x="633" y="193.5"/><use href="#h" x="633" y="226.5"/>

  <!-- Arañas -->
  <circle cx="140" cy="210" r="15" fill="#c9f2c0" stroke="#2f6b25" stroke-width="1.4"/>
  <circle cx="370" cy="210" r="15" fill="#c9f2c0" stroke="#2f6b25" stroke-width="1.4"/>
  <circle cx="600" cy="210" r="15" fill="#f7a8a8" stroke="#8f2a2a" stroke-width="1.4"/>
  <g font-size="15" font-style="italic" text-anchor="middle">
    <text x="140" y="215">α</text><text x="370" y="215">α</text><text x="600" y="215">α</text>
  </g>

  <!-- Puntos suspensivos (n patas) -->
  <g font-size="16" text-anchor="middle" fill="#333">
    <text x="72" y="215">⋮</text><text x="208" y="215">⋮</text>
    <text x="302" y="215">⋮</text><text x="438" y="215">⋮</text>
    <text x="532" y="215">⋮</text><text x="668" y="215">⋮</text>
  </g>

  <text x="255" y="217" font-size="22" text-anchor="middle">=</text>
  <text x="485" y="217" font-size="22" text-anchor="middle">=</text>

  <text x="30" y="295" font-size="16" font-style="italic" fill="#222">Una Hadamard conmuta a través de un nodo cambiando su color.</text>
</svg>
